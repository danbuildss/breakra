  <line x1="1000" y1="80" x2="1000" y2="440" stroke="#F4EFE1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#F4EFE1">
    <line x1="282" y1="122" x2="996" y2="122" stroke="#F4EFE1" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="640" y="112" text-anchor="middle">① POST { before, after }</text>

    <line x1="998" y1="182" x2="284" y2="182" stroke="#F4EFE1" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="640" y="172" text-anchor="middle">402 · exact · Base · USDC · 20000 ($0.02)</text>

    <rect x="120.5" y="208.5" width="319" height="51" rx="10" fill="#14130F" stroke="#F4EFE1" stroke-opacity="0.5"/>
