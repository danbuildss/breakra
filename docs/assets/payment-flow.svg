    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F4EFE1" fill-opacity="0.45"/></marker>
  </defs>
  <rect width="1280" height="470" fill="#0D0C0A"/>
  <g font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">
