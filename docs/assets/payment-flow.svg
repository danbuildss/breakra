    <text x="280" y="250" font-size="12" text-anchor="middle" fill-opacity="0.55">never re-sign automatically</text>

    <line x1="282" y1="300" x2="996" y2="300" stroke="#F4EFE1" stroke-width="1.5" marker-end="url(#a)"/>
