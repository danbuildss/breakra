    <text x="640" y="350" text-anchor="middle" font-weight="700">200 · findings · charged $0.02</text>

    <line x1="998" y1="418" x2="284" y2="418" stroke="#F4EFE1" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#d)"/>
