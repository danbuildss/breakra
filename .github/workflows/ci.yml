name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # writes/reads bun.lock (lockfileVersion 2)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build single-file handler
        run: bun run build

      - name: Smoke-test built handler (Bun 1.4.2)
        run: bun run smoke

      - name: Switch to Bankr's runtime version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # Bankr x402 Cloud runtime, observed in T-001 T2

      - name: Smoke-test built handler under Bankr's Bun 1.3.14
        run: bun --version && bun scripts/smoke.ts

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install oasdiff (pinned)
        run: go install github.com/oasdiff/oasdiff@v1.33.0

      - name: Cross-check against oasdiff
        run: OASDIFF="$(go env GOPATH)/bin/oasdiff" bun run oracle
