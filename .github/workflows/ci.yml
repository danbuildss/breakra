name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # writes/reads bun.lock (lockfileVersion 2)

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build single-file handler
        run: bun run build

      - name: Smoke-test built handler (Bun 1.4.2)
        run: bun run smoke

      - name: Switch to Bankr's runtime version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14 # Bankr x402 Cloud runtime, observed in T-001 T2

      - name: Smoke-test built handler under Bankr's Bun 1.3.14
        run: bun --version && bun scripts/smoke.ts

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26"

      - name: Install oasdiff (pinned)
        run: go install github.com/oasdiff/oasdiff@v1.33.0

      - name: Cross-check against oasdiff
        run: OASDIFF="$(go env GOPATH)/bin/oasdiff" bun run oracle

  npm-package:
    # D-041: the published package must install and run on every supported Node version, without Bun at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Pack, install outside the repo, run CLI + MCP on Node ${{ matrix.node }}
        run: node --version && bun run npm-smoke

