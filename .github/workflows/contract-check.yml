# Breakra checks Breakra: fail a pull request whose openapi.json change may break callers of the hosted API.
# Uses the official Breakra GitHub Action (D-047); free, nothing leaves the runner.
name: API contract (Breakra)

on:
  pull_request:
    paths:
      - openapi.json
      - .github/workflows/contract-check.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  breakra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: danbuildss/breakra-action@v1.1.0
        with:
          spec: openapi.json
          fail-on: review
