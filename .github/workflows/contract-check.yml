# Breakra checks Breakra: fail a pull request whose openapi.json change may break callers of the hosted API.
# Same recipe as examples/github-actions/breakra.yml, using the published CLI (free; nothing leaves the runner).
name: API contract (Breakra)

on:
  pull_request:
    paths:
      - openapi.json
      - .github/workflows/contract-check.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  breakra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TEST ONLY (throwaway PR, not for merge): the new action, pinned to its PR commit.
      - uses: danbuildss/breakra-action@88908561eb95f5d9b9646eaec4e4b5315328e515
        with:
          spec: openapi.json
          fail-on: review
